# XcodeGen spec for Wait. Regenerate with `cd Wait && xcodegen generate`.
# Never hand-edit Wait.xcodeproj/project.pbxproj; edit this file instead.
# Every module lives in the local package Packages/WaitKit; only the app, widget and watch app are Xcode targets.
name: Wait
options:
  bundleIdPrefix: com.chenkai
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: 5WDN96EM72
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaitKit:
    path: Packages/WaitKit
targets:
  Wait:
    type: application
    platform: iOS
    sources:
      - path: Wait
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkai.wait
        INFOPLIST_FILE: Wait/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Wait/Preview Content"'
        ENABLE_PREVIEWS: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Wait/Wait.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Wait/WaitRelease.entitlements
    postBuildScripts:
      - name: "ATS: allow local networking (Debug only)"
        basedOnDependencyAnalysis: false
        script: |
          # Debug builds may talk to `npm run dev` on http://localhost:3000. Release builds never get this key.
          [ "${CONFIGURATION}" = "Debug" ] || exit 0
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
    dependencies:
      - package: WaitKit
        product: AppFeature
      - target: WaitWidgetExtension
      - target: WaitWatch
        embed: true
        link: false
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
  WaitWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WaitWidget
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkai.wait.WaitWidget
        INFOPLIST_FILE: WaitWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: WaitWidget/WaitWidget.entitlements
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - package: WaitKit
        product: Domain
      - package: WaitKit
        product: DesignSystem
      - package: WaitKit
        product: Persistence
  WaitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WaitWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkai.wait.watchkitapp
        PRODUCT_NAME: WaitWatch
        DEVELOPMENT_TEAM: 5WDN96EM72
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Wait
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chenkai.wait
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"WaitWatch/Preview Content\""
        ENABLE_PREVIEWS: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - package: WaitKit
        product: Domain
      - package: WaitKit
        product: DesignSystem
      - package: WaitKit
        product: Connectivity
schemes:
  Wait:
    build:
      targets:
        Wait: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  WaitWatch:
    build:
      targets:
        WaitWatch: all
    run:
      config: Debug
    archive:
      config: Release
