# XcodeGen spec for Wait. Regenerate with `cd Wait && xcodegen generate`.
# Never hand-edit Wait.xcodeproj/project.pbxproj; edit this file instead.
name: Wait
options:
  bundleIdPrefix: com.ck
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: 5WDN96EM72
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaitKit:
    path: Packages/WaitKit
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.4.3
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 0.9.0
  Money:
    url: https://github.com/Flight-School/Money
    from: 1.3.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.0.0
  SwiftyJSON:
    url: https://github.com/SwiftyJSON/SwiftyJSON
    from: 5.0.1
targetTemplates:
  Framework:
    type: framework
    platform: iOS
    sources:
      - path: ${target_name}
        excludes:
          - "Info.plist"
          - "*.h"
          - "*.docc"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ck.${target_name}
        PRODUCT_NAME: "$(TARGET_NAME:c99extidentifier)"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ${target_name}
        excludes:
          - "__Snapshots__"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ck.${target_name}
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
targets:
  UI:
    templates: [Framework]
  SettingsTab:
    templates: [Framework]
    dependencies:
      - package: WaitKit
        product: ChecklistEditFeature
      - package: WaitKit
        product: Model
      - package: ComposableArchitecture
  StockDetailsFeature:
    templates: [Framework]
    dependencies:
      - package: WaitKit
        product: CacheService
      - package: WaitKit
        product: Networking
      - package: WaitKit
        product: Logging
      - package: WaitKit
        product: Checklist
      - package: WaitKit
        product: DesignSystem
      - package: WaitKit
        product: Model
      - package: WaitKit
        product: StockCharts
      - package: ComposableArchitecture
  StockDetailsFeatureTests:
    templates: [UnitTests]
    dependencies:
      - target: StockDetailsFeature
      - package: WaitKit
        product: Model
      - package: SnapshotTesting
  WaitWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WaitWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkai.wait.WaitWidget
        INFOPLIST_FILE: WaitWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: WaitWidgetExtensionRelease.entitlements
    dependencies:
      - package: WaitKit
        product: Model
      - package: WaitKit
        product: Logging
      - package: WaitKit
        product: DesignSystem
      - package: WaitKit
        product: Networking
      - package: WaitKit
        product: CacheService
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
  WaitWatch:
    type: application
    platform: watchOS
    sources:
      - path: "WaitWatch Watch App"
      - path: Shared/Connectivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkai.wait.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: "WaitWatch Watch App/Info.plist"
        INFOPLIST_KEY_CFBundleDisplayName: WaitWatch
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chenkai.wait
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"WaitWatch Watch App/Preview Content"'
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: Money
      - package: SwiftyJSON
      - package: Alamofire
  Wait:
    type: application
    platform: iOS
    sources:
      - path: Wait
      - path: Shared/Connectivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkai.wait
        INFOPLIST_FILE: Wait/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Wait/Preview Content"'
        ENABLE_PREVIEWS: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Wait/Wait.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Wait/WaitRelease.entitlements
    dependencies:
      - target: UI
      - package: WaitKit
        product: Model
      - package: WaitKit
        product: Networking
      - package: WaitKit
        product: DesignSystem
      - package: WaitKit
        product: Logging
      - package: WaitKit
        product: Checklist
      - package: WaitKit
        product: ChecklistEditFeature
      - package: WaitKit
        product: StockCharts
      - target: SettingsTab
      - target: StockDetailsFeature
      - package: WaitKit
        product: CacheService
      - target: WaitWidgetExtension
      - target: WaitWatch
        embed: true
        link: false
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
      - package: ComposableArchitecture
schemes:
  Wait:
    build:
      targets:
        Wait: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StockDetailsFeatureTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  WaitWatch:
    build:
      targets:
        WaitWatch: all
    run:
      config: Debug
    archive:
      config: Release
